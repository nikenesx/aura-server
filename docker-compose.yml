services:
  asr:
    build:
      context: .
      dockerfile: asr/Dockerfile
    restart: unless-stopped
    expose:
      - "8090"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      ASR_URL: http://asr:8090
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      ASR_TIMEOUT: ${ASR_TIMEOUT:-30m}
    depends_on:
      asr:
        condition: service_healthy
