services:
  asr:
    build:
      context: .
      dockerfile: asr/Dockerfile
      pull: false
    restart: unless-stopped
    expose:
      - "8090"
    environment:
      ASR_DECODER: ${ASR_DECODER:-greedy}
      ORT_INTRA_OP_NUM_THREADS: ${ORT_INTRA_OP_NUM_THREADS:-8}
      OMP_NUM_THREADS: ${ORT_INTRA_OP_NUM_THREADS:-8}
      MKL_NUM_THREADS: ${ORT_INTRA_OP_NUM_THREADS:-8}

  api:
    build:
      context: .
      dockerfile: Dockerfile
      pull: false
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      ASR_URL: http://asr:8090
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      ASR_TIMEOUT: ${ASR_TIMEOUT:-30m}
    depends_on:
      asr:
        condition: service_healthy
