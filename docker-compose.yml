services:
  asr:
    build:
      context: .
      dockerfile: asr/Dockerfile
      pull: false
    restart: unless-stopped
    expose:
      - "8090"
    environment:
      ASR_DECODER: ${ASR_DECODER:-greedy}
      ORT_INTRA_OP_NUM_THREADS: ${ORT_INTRA_OP_NUM_THREADS:-8}
      OMP_NUM_THREADS: ${ORT_INTRA_OP_NUM_THREADS:-8}
      MKL_NUM_THREADS: ${ORT_INTRA_OP_NUM_THREADS:-8}
      VAD_ENABLED: ${VAD_ENABLED:-true}
      VAD_MODEL: /models/silero_vad.onnx
      VAD_THRESHOLD: ${VAD_THRESHOLD:-0.5}
      VAD_MIN_SPEECH_MS: ${VAD_MIN_SPEECH_MS:-300}
      VAD_MIN_SILENCE_MS: ${VAD_MIN_SILENCE_MS:-400}
      VAD_PAD_MS: ${VAD_PAD_MS:-300}
      AGC_ENABLED: ${AGC_ENABLED:-true}
      AGC_FILTER: ${AGC_FILTER:-}

  api:
    build:
      context: .
      dockerfile: Dockerfile
      pull: false
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      ASR_URL: http://asr:8090
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      ASR_TIMEOUT: ${ASR_TIMEOUT:-30m}
    depends_on:
      asr:
        condition: service_healthy
