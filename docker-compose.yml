name: aura

services:
  asr:
    build:
      context: .
      dockerfile: docker/asr.Dockerfile
    image: aura-asr:local
    env_file:
      - .env
    environment:
      HOME: /cache
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface
      TORCH_HOME: /cache/torch
      XDG_CACHE_HOME: /cache
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    init: true
    shm_size: "2gb"
    volumes:
      - model-cache:/cache
    expose:
      - "8090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 900s
    restart: unless-stopped

  # Appointment cards. Starts after ASR so ASR has taken its share of VRAM;
  # --gpu-memory-utilization caps vLLM, which otherwise grabs 90% of the card.
  llm:
    image: vllm/vllm-openai:${VLLM_TAG:-v0.29.0}
    entrypoint: ["vllm", "serve"]
    command:
      - ${LLM_HF_MODEL:-t-tech/T-lite-it-2.1-FP8}
      - --served-model-name=t-lite
      - --max-model-len=${LLM_MAX_MODEL_LEN:-32768}
      - --gpu-memory-utilization=${LLM_GPU_MEMORY_UTILIZATION:-0.6}
      - --kv-cache-dtype=fp8
      - --enable-prefix-caching
    environment:
      HF_HOME: /cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Without this vLLM fails on Windows with "UVA is not available":
      # it turns off pinned memory under WSL2, which its model runner needs.
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
    gpus: all
    init: true
    shm_size: "4gb"
    volumes:
      - model-cache:/cache
    ports:
      # Published on localhost so a Go API running on the host can use it too.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 1800s
    depends_on:
      asr:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: aura-api:local
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8080"
      ASR_URL: http://asr:8090
      # The API does not wait for the LLM: cards queue until it is up.
      LLM_URL: http://llm:8000
      DATA_DIR: /data
    volumes:
      # SQLite and the recordings. Losing it loses every doctor's history.
      - api-data:/data
    ports:
      - "8080:8080"
    init: true
    depends_on:
      asr:
        condition: service_healthy
    restart: unless-stopped

volumes:
  model-cache:
  api-data:
